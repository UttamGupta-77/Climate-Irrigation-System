<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Smart Irrigation Dashboard</title>


  <!-- Chart.js -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


  <style>

    body {

      font-family: 'Poppins', sans-serif;

      background:
        linear-gradient(
          135deg,
          #e3f2fd,
          #c8e6c9
        );

      margin: 0;

      padding: 0;

      display: flex;

      justify-content: center;

      min-height: 100vh;
    }


    .container {

      text-align: center;

      margin-top: 40px;

      margin-bottom: 40px;

      background: white;

      padding: 30px;

      border-radius: 20px;

      box-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.1);

      width: 85%;

      max-width: 1000px;
    }


    h1 {

      color: #2e7d32;

      font-size: 2.5rem;
    }


    h2 {

      margin-bottom: 30px;
    }


    .card-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px, 1fr)
        );

      gap: 20px;

      margin-top: 30px;
    }


    .card {

      background: #f9f9f9;

      padding: 20px;

      border-radius: 15px;

      box-shadow:
        0 2px 5px
        rgba(0, 0, 0, 0.1);
    }


    .card h3 {

      margin-bottom: 15px;
    }


    .card p {

      font-size: 1.5rem;

      margin: 0;
    }


    .status.on {

      border-left:
        5px solid #4caf50;

      color: #4caf50;
    }


    .status.off {

      border-left:
        5px solid #f44336;

      color: #f44336;
    }


    button {

      margin-top: 20px;

      background: #2e7d32;

      color: white;

      border: none;

      padding: 12px 25px;

      font-size: 1rem;

      border-radius: 8px;

      cursor: pointer;

      transition: 0.3s;
    }


    button:hover {

      background: #388e3c;
    }


    .chart-section {

      margin-top: 50px;

      padding: 20px;

      background: #fafafa;

      border-radius: 15px;
    }


    .chart-title {

      font-size: 1.4rem;

      font-weight: bold;

      color: #555;

      margin-bottom: 20px;
    }


    .firebase-info {

      margin-top: 15px;

      color: #666;

      font-size: 0.9rem;
    }


    canvas {

      width: 100% !important;

      height: 400px !important;
    }


    @media (max-width: 600px) {

      .container {

        width: 90%;

        padding: 20px;
      }


      h1 {

        font-size: 2rem;
      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- ----------------------------------------- -->
    <!-- TITLE -->
    <!-- ----------------------------------------- -->

    <h1>
      🌦 Smart Irrigation System
    </h1>


    <h2>
      {{ data.city }}
    </h2>


    <!-- ----------------------------------------- -->
    <!-- CURRENT DATA CARDS -->
    <!-- ----------------------------------------- -->

    <div class="card-grid">


      <!-- Temperature -->

      <div class="card">

        <h3>
          🌡 Temperature
        </h3>

        <p>
          {{ data.temperature }} °C
        </p>

      </div>


      <!-- Humidity -->

      <div class="card">

        <h3>
          💧 Humidity
        </h3>

        <p>
          {{ data.humidity }}%
        </p>

      </div>


      <!-- Soil Moisture -->

      <div class="card">

        <h3>
          🌱 Soil Moisture
        </h3>

        <p>
          {{ data.soil_moisture }}%
        </p>

      </div>


      <!-- Irrigation Status -->

      <div
        class="card status
        {{ 'on' if data.irrigation_status == 'ON' else 'off' }}"
      >

        <h3>
          🚰 Irrigation Status
        </h3>

        <p>
          {{ data.irrigation_status }}
        </p>

      </div>


    </div>


    <!-- ----------------------------------------- -->
    <!-- REFRESH BUTTON -->
    <!-- ----------------------------------------- -->

    <button
      onclick="location.reload()"
    >

      🔄 Refresh Data

    </button>


    <!-- ----------------------------------------- -->
    <!-- FIREBASE CHART -->
    <!-- ----------------------------------------- -->

    <div class="chart-section">


      <div class="chart-title">

        Environmental Conditions Over Time

      </div>


      <canvas id="climateChart"></canvas>


      <div class="firebase-info">

        Historical data loaded from Firebase

      </div>


    </div>


  </div>


  <script>


    // --------------------------------------------
    // DATA FROM FLASK
    // --------------------------------------------

    const labels =
      {{ chart_labels | tojson }};


    const tempData =
      {{ temperature_data | tojson }};


    const humidityData =
      {{ humidity_data | tojson }};


    const moistureData =
      {{ moisture_data | tojson }};


    // --------------------------------------------
    // GET CANVAS
    // --------------------------------------------

    const ctx =
      document
        .getElementById(
          'climateChart'
        )
        .getContext('2d');


    // --------------------------------------------
    // CREATE CHART
    // --------------------------------------------

    const climateChart = new Chart(
      ctx,
      {

        type: 'line',

        data: {

          labels: labels,

          datasets: [

            {

              label:
                'Temperature (°C)',

              data:
                tempData,

              borderColor:
                '#ff5722',

              borderWidth: 2,

              fill: false,

              tension: 0.3

            },


            {

              label:
                'Humidity (%)',

              data:
                humidityData,

              borderColor:
                '#2196f3',

              borderWidth: 2,

              fill: false,

              tension: 0.3

            },


            {

              label:
                'Soil Moisture (%)',

              data:
                moistureData,

              borderColor:
                '#4caf50',

              borderWidth: 2,

              fill: false,

              tension: 0.3

            }

          ]

        },


        options: {

          responsive: true,

          maintainAspectRatio: false,

          plugins: {

            legend: {

              position: 'top',

              labels: {

                font: {

                  size: 14

                }

              }

            },


            title: {

              display: false

            }

          },


          scales: {

            y: {

              beginAtZero: true,

              max: 100

            }

          }

        }

      }

    );

  </script>


</body>

</html>
